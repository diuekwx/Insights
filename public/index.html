<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Insights</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Insights</span>
    </div>

    <div class="status" id="status" data-state="starting" role="status" aria-live="polite">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="status-text">Starting…</span>
      <span class="status-hint" id="status-hint"></span>
    </div>
  </header>

  <main class="layout">
    <section class="player">
      <div class="video-frame">
        <div id="vod-placeholder" class="placeholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
            <rect x="2.5" y="6" width="13" height="12" rx="2.5"/>
            <path d="M15.5 10.5l5-3v9l-5-3"/>
          </svg>
          <p id="placeholder-title" class="placeholder-title">No games yet</p>
          <p id="placeholder-text" class="placeholder-text">Play a game of League. Recording starts by itself when the game loads, and the video and your key moments show up here when it ends.</p>
        </div>
        <video id="vod" onclick="play()">
          <source id="vod-source" type="video/mp4">
          Your browser does not support HTML video.
        </video>
      </div>

      <div class="controls">
        <button id="playButton" class="icon-btn" aria-label="Play" onclick="play()" disabled>
          <svg class="icon-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.6v10.8a.6.6 0 0 0 .92.5l8.3-5.4a.6.6 0 0 0 0-1L5.42 2.1a.6.6 0 0 0-.92.5z"/></svg>
          <svg class="icon-pause" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="2.5" width="3" height="11" rx="1"/><rect x="9.5" y="2.5" width="3" height="11" rx="1"/></svg>
        </button>
        <span class="time"><span id="current-time">0:00</span> / <span id="duration">0:00</span></span>
        <div class="legend" aria-hidden="true">
          <span class="legend-item"><span class="swatch kill"></span>Kill</span>
          <span class="legend-item"><span class="swatch multikill"></span>Multikill</span>
        </div>
      </div>

      <div class="timeline">
        <div id="track" class="track" role="slider" tabindex="0" aria-label="Seek"
             aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
          <div class="track-rail"><div id="progress" class="track-progress"></div></div>
          <div id="markers" class="markers"></div>
          <div id="playhead" class="playhead"></div>
        </div>
      </div>
    </section>

    <aside class="events">
      <div class="events-header">
        <div>
          <h2>Key moments</h2>
          <p id="game-meta" class="game-meta"></p>
        </div>
        <span id="event-count" class="count">0</span>
      </div>
      <ul id="event-list" class="event-list"></ul>
    </aside>
  </main>

  <script src="./script.js"></script>

</body>
</html>
